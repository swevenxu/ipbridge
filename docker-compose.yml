services:
  photobridge:
    build: .
    restart: unless-stopped
    ports:
      # HOST_PORT=80 on a VPS gives the 4S a plain-HTTP door with no TLS in the way
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - photos:/app/uploads
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  photos:
